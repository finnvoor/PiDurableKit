name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Xcode 27, for the iOS 27 and macOS 27 SDKs.
    runs-on: xcode-27
    # A typical run takes about two minutes; a hang fails instead of holding the runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: JS/package-lock.json

      - name: Build the JavaScript bundle
        working-directory: JS
        run: |
          npm ci
          npm run build
          npm test

      - name: Check the committed bundle is up to date
        run: git diff --exit-code -- Sources/PiDurableKit/Resources Sources/PiDurableKit/Generated JS/src/versions.ts

      - name: Test (macOS)
        env:
          # Optional: real requests to these providers run only when the secrets are set.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: swift test

      # The tests run on macOS only: they exercise the same code on iOS, and booting a simulator took most of the run.
      # Building the documentation for iOS compiles the package for iOS, so iOS-only build errors still fail.
      - name: Build the documentation (and the package for iOS)
        run: xcodebuild docbuild -scheme PiDurableKit -destination "generic/platform=iOS Simulator" OTHER_DOCC_FLAGS="--warnings-as-errors" -quiet
